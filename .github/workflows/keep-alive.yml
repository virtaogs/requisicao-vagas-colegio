name: Supabase keep-alive

# Projetos gratuitos do Supabase pausam depois de ~7 dias sem atividade.
# Essa rotina faz uma consulta simples de vez em quando pra evitar isso.
#
# Importante: o GitHub desativa sozinho agendamentos (schedule) de
# repositórios com 60+ dias sem NENHUM commit — mesmo que essa Action
# estivesse rodando certinho. Por isso, a cada execução bem-sucedida,
# ela também registra um commit (timestamp em .github/last-ping.txt),
# o que mantém o próprio agendamento vivo indefinidamente.
on:
  schedule:
    - cron: '0 8 */5 * *' # a cada 5 dias, 08h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consulta simples no Supabase
        run: |
          curl -sf "${SUPABASE_URL}/rest/v1/usuarios_app?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "status: %{http_code}\n"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Registra o ping (mantém o agendamento do GitHub vivo)
        run: |
          mkdir -p .github
          date -u "+%Y-%m-%dT%H:%M:%SZ" > .github/last-ping.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-ping.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive ping [skip ci]"
          git push
